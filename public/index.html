<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Mercado de Asociados — Scarface 1920</title>
<meta name="description" content="Mercado virtual compartido de cartas de Asociado para la partida de Scarface 1920." />

<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#14110f" />

<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Scarface Market" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="landing" class="screen">
  <div class="landing-card">
    <h1 class="brand">SCARFACE <span>1920</span></h1>
    <p class="subtitle">Mercado de Asociados</p>

    <div class="landing-actions">
      <button id="btnCreate" class="btn btn-primary">Crear sala nueva</button>

      <div class="divider"><span>o</span></div>

      <form id="formJoin" class="join-form">
        <input id="inputCode" type="text" maxlength="5" placeholder="CÓDIGO DE SALA" autocomplete="off" autocapitalize="characters" />
        <button type="submit" class="btn btn-secondary">Unirse</button>
      </form>
    </div>
    <p id="landingError" class="landing-error" hidden></p>
  </div>
</div>

<div id="roomScreen" class="screen" hidden>
  <header class="room-header">
    <div class="room-header-left">
      <span class="brand-mini">SCARFACE 1920</span>
    </div>
    <div class="room-header-center">
      <button id="btnShowCode" class="room-code" title="Toca para copiar el enlace de la sala">Sala <strong id="roomCodeLabel">----</strong></button>
    </div>
    <div class="room-header-right">
      <span id="connStatus" class="conn-status conn-off" title="Estado de conexión"></span>
      <span id="viewerCount" class="viewer-count" title="Jugadores conectados">👥 1</span>
      <button id="btnReset" class="btn btn-danger btn-small">Reiniciar mercado</button>
    </div>
  </header>

  <div id="selectionBanner" class="selection-banner" hidden>
    <span id="selectionText"></span>
    <button id="btnCancelSelection" class="btn btn-tiny">Cancelar</button>
  </div>

  <main class="room-main">
    <section class="market-section">
      <h2 class="section-title">Mercado</h2>
      <div class="market-row">
        <div class="market-tier">
          <h3 class="tier-label tier-low">Nivel 1–3</h3>
          <div id="marketLow" class="card-grid market-grid-low"></div>
        </div>
        <div class="market-tier">
          <h3 class="tier-label tier-high">Nivel 4–5</h3>
          <div id="marketHigh" class="card-grid market-grid-high"></div>
        </div>
      </div>
    </section>

    <section class="discard-section">
      <button id="discardPile" class="discard-pile">
        <span class="discard-pile-icon">🗑</span>
        <span class="discard-pile-label">Descarte</span>
        <span id="discardCount" class="discard-pile-count">0</span>
      </button>
      <div id="discardGrid" class="card-grid discard-grid" hidden></div>
    </section>

    <section class="pool-section">
      <div class="pool-header">
        <h2 class="section-title">Todas las demás cartas</h2>
        <input id="poolSearch" type="search" placeholder="Buscar por nombre…" class="pool-search" />
      </div>
      <div id="poolGrid" class="card-grid pool-grid"></div>
    </section>
  </main>
</div>

<div id="zoomModal" class="zoom-modal" hidden>
  <div class="zoom-backdrop"></div>
  <button id="zoomPrev" class="zoom-nav zoom-nav-prev" aria-label="Carta anterior" hidden>‹</button>
  <div class="zoom-content">
    <button id="zoomClose" class="zoom-close" aria-label="Cerrar">✕</button>
    <div id="zoomCardHost"></div>
  </div>
  <button id="zoomNext" class="zoom-nav zoom-nav-next" aria-label="Carta siguiente" hidden>›</button>
</div>

<div id="confirmModal" class="confirm-modal" hidden>
  <div class="zoom-backdrop"></div>
  <div class="confirm-box">
    <p id="confirmText"></p>
    <div class="confirm-actions">
      <button id="confirmCancel" class="btn btn-secondary">Cancelar</button>
      <button id="confirmOk" class="btn btn-danger">Confirmar</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
